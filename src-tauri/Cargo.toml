[package]
name = "ayanball-chat"
version = "1.0.0"
description = "AyanBall Chat 桌面客户端"
authors = ["AyanBall"]
edition = "2021"

[lib]
name = "ayanball_chat_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
